
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Apple</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;

        }

        header {
            background-color: rgb(0, 0, 0);

            padding: 20px;
            text-align: center;
        }

        nav a {

            margin: 10px;
            text-decoration: none;
        }

        main {
            width: 80%;

        }

        section {
